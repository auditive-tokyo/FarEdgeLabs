# ---------------------------------------------------------------------------
# SonarQube Cloud（**CI 解析**）。走らせるのは .github/workflows/quality-check.yml
# ---------------------------------------------------------------------------
#
# > [!warning] 読まれるファイルは解析方式で入れ替わる
# > CI 解析が読むのは**このファイル**。自動解析（GitHub App 任せ）は逆に
# > `.sonarcloud.properties` しか読まず、**このファイルを無視する**。
# > 一度それで踏んだ: 自動解析のままここに除外を書いて、一切効いていなかった。
# > 自動解析へ戻すなら、除外をあちらへ移し直すこと（ワイルドカードが使えないので
# > 実ファイルの列挙になる）。
#
# ## 解析から外しているもの
#
# **製品コードでないものだけ**を外す。指摘が気に入らないから外す、はやらない。
# 「実在するが承知で受け入れる」は Accepted（下）、「そもそも解析対象ではない」がここ。
#
# payroll/**
#   CLAUDE.md のとおり、サイトのビルドにもデプロイにも一切関与しない。加えて
#   `payslip.gs` は Google 側 Apps Script の**写し**で、ここを直しても本体は変わらない。
#   直せない写しを解析しても雑音にしかならない。
#   → **ここが本物のロジックを持ち始めたら、この除外を見直すこと。**
#
# gc_run_functions/work_statics/probe.py
#   **デプロイされない。** `terraform/main.tf` の `archive_file` が固めるのは `main.py`
#   と `requirements.txt` だけで、probe.py は手元の診断用スクリプト。パスは操作者が
#   自分で打つ CLI 引数から来る（ファイル名側は英数字のみにサニタイズ済み）。
#   同じディレクトリの `main.py` は**解析対象のまま**なので、ファイル単位で外している。
#
# ## Accepted にした指摘と、その理由（2026-09-09）
#
# **SonarQube 側に理由を書く場所が無い。** issue の状態を変える API
# (`change_sonar_issue_status`) は key と status しか受け取らないので、ダッシュボード上は
# 「誰かが黙って消した」ようにしか見えない。再提案されたらまずこれを読むこと。
#
# terraform:S6404 "granting public access" ×3 — contact.tf / main.tf / realtime.tf
#   `allUsers` は3箇所とも**設計の中心**であって漏れではない。静的ページは提示できる
#   資格情報を持たないので、問い合わせ関数も通話中継も無認証でしか呼べず、`stats.json`
#   も無認証でしか読めない。守りは関数の内側（Turnstile・入力上限・失敗時ログ）と、
#   通話中継については **OpenAI 側の月次支出上限**に置いてある。
#   → CLAUDE.md「The backend」、gc_run_functions/contact_form/main.py の冒頭、
#     terraform/realtime.tf の公開の節
#
#   **NOSONAR は使わない。** Terraform でも動く（コメント内のどこでも可）が、公式が
#   "silences all current and future issues on a line" と書いているとおり、その行の
#   **将来の指摘まで**黙らせる。対象は `member = "allUsers"` — このファイルで最も
#   安全性に敏感な1行で、別の規則が本当の問題を見つける可能性が最も高い場所。
#   そこに包括的な抑制を置くのは、選ぶ行を間違えている。Accept なら規則ごとなので、
#   同じ行に別の規則が当たれば鳴る。
#
# terraform:S6400 "full access to the resource" — main.tf の work_statistics_writer
#   `roles/storage.objectAdmin` を**公開バケット1つに限定**して付けている。GCS は既存
#   オブジェクトの上書きに create だけでなく delete も要求するので、`objectCreator`
#   だけでは日次の書き換えが落ちる。
#   → **ここは絞る余地が残っている。** 恒久的に正しいと決めたわけではない
#
# terraform:S6258 "omitting logging" ×3 — バケット3つ
#   アクセスログを取るとログ用バケットとその保管費が増える。訪問者がほぼ居ないサイトで
#   釣り合わない。ただし **state バケットだけは議論の余地がある**（誰が state を触ったか
#   は知りたくなりうる）。足すならそこから。
#
# terraform:S6412 "omitting versioning" ×2 — function_source と public
#   `function_source` のオブジェクトは**内容ハッシュを名前に持つ**ので版を重ねる概念が
#   無い。`public` は日次で上書きされる stats.json 1つだけで、古い版に価値が無い。
#   state バケットは versioning 有効（だからこのルールが出ていない）。
# ---------------------------------------------------------------------------

sonar.projectKey=auditive-tokyo_FarEdgeLabs
