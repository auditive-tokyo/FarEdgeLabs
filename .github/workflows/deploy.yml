  # Frontend Deploy (Next.js static export → GitHub Pages)
  #
  # The CDK job above is commented out while the frontend is being rebuilt: the
  # new app calls no API yet, so there is nothing to deploy it for. Restore both
  # the job and `needs: deploy-infrastructure` here once the app consumes the
  # API Gateway endpoint at build time.
  build-and-deploy:
    runs-on: ubuntu-latest
    # peaceiris/actions-gh-pages pushes the build to the gh-pages branch.
    # Declared explicitly so the job keeps working if the org default for
    # GITHUB_TOKEN is tightened to read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        # --ignore-scripts: nothing in this tree needs an install script. sharp
        # and unrs-resolver resolve their platform binaries through optional
        # dependencies, verified to load with scripts blocked.
        run: npm ci --ignore-scripts

      - name: Build
        env:
          # Drives canonical URLs, OG tags, robots.txt, sitemap.xml and JSON-LD
          # (src/lib/site.ts). Baked in at build time — a static export has no
          # runtime env. Lowercase, no trailing slash.
          NEXT_PUBLIC_SITE_URL: https://faredgelabs.com
          # Empty: the site is served from a domain root, not /<repo>/.
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@1ef5a1b1df4c63fe21a2242edbee6cac921ece01 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # `next build` with `output: "export"` writes here, not ./dist.
          # public/CNAME and public/.nojekyll are copied into it, so the custom
          # domain and the `_next/` directory survive every deploy.
          publish_dir: ./out
