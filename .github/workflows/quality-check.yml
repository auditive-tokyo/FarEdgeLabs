name: Quality Check

# SonarQube Cloud の解析。**自動解析ではなく CI 解析**。
#
# 自動解析（GitHub App が勝手に走らせるほう）から切り替えた。理由は新規コードの定義に
# "Previous version" を使いたいから — 自動解析には `sonar.projectVersion` を渡す手段が
# 無く（`.sonarcloud.properties` のサポート設定に含まれない）、全解析が
# `not provided` になってバージョンで区切れない。
#
# > [!warning] SonarCloud 側で自動解析を切ること
# > 両方有効だと CI からの解析が拒否される。Administration → Analysis Method。
# > あわせて `SONAR_TOKEN`（**User** トークン）をこのリポジトリの secrets に入れる。
#
# 設定ファイルも入れ替わる: CI 解析が読むのは `sonar-project.properties` で、
# `.sonarcloud.properties` は**無視される**（自動解析のときと逆）。

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "LICENSE.md"
      - "CLAUDE.md"
      - "TODO.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # 全履歴が要る。Sonar は blame で「その行がいつ入ったか」を見て新規コードを
          # 決めるので、浅いクローンだと範囲を誤る。
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        # 解析のために入れる。TypeScript の型情報を使う規則があり、依存が無いと
        # **静かに検出数が減る**（落ちるのではなく、見つからなくなる）。
        # `--ignore-scripts` の理由は deploy.yml と同じ。
        run: npm ci --ignore-scripts

      - name: Resolve project version
        id: version
        # 新規コードの区切りに使う値。**`package.json` は使わない** — `0.1.0` のまま
        # 動いておらず、手でバンプする習慣もないので、区切りとして機能しない。
        #
        # 代わりに `production` の最終コミット日を使う。リリース PR が
        # `Release YYYY-MM-DD` という日付運用なので、**リリースが入った瞬間だけ値が
        # 変わる**。main への push はその間ずっと同じ値を共有するため、新規コード＝
        # 「前回デプロイ以降」になる。新しい習慣を増やさずに済むのが利点。
        run: |
          git fetch --depth=1 origin production 2>/dev/null || true
          VERSION=$(git log FETCH_HEAD -1 --format=%cs 2>/dev/null || true)
          # production をまだ一度も切っていない場合の逃げ道。
          [ -n "$VERSION" ] || VERSION=unreleased
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "projectVersion = $VERSION"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.version.outputs.value }}
