name: Infrastructure

on:
  push:
    branches:
      - production
    paths:
      - "terraform/**"
      - "gc_run_functions/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

concurrency:
  group: terraform-faredgelabs
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  WORKLOAD_IDENTITY_PROVIDER: projects/89292293815/locations/global/workloadIdentityPools/github/providers/github-actions
  SERVICE_ACCOUNT: tf-deployer@faredgelabs.iam.gserviceaccount.com
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@140bb5113ffb6b65a7e9b937a81fa96cf5064462 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: Publish plan to the run summary
        run: |
          {
            echo '## terraform plan'
            echo
            echo '```terraform'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: |
          github.ref == 'refs/heads/production' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: terraform apply -input=false -auto-approve tfplan
